"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "pnpm install --frozen-lockfile"
run_mode = "concurrent"

[scripts.run.services]
available_in = ["local"]
command = "scripts/local-stack.sh up && scripts/local-stack.sh seed dev"
icon = "database"

[scripts.run.dev]
available_in = ["local"]
command = "scripts/local-stack.sh up && scripts/run-local-dev.sh"
default = true
icon = "play"

[scripts.run.test]
command = "pnpm test"
icon = "test-tube"

[scripts.run.integration]
available_in = ["local"]
command = "scripts/local-stack.sh up && scripts/local-stack.sh smoke conductor-a conductor-b"
icon = "shield-check"
